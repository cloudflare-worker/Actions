name: Deploy External Worker to Cloudflare

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取源仓库代码
      - name: Checkout Source Repository
        uses: actions/checkout@v4
        with:
          repository: '1345695/edcloudwasm'

      # 2. 安装 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. 【关键步骤】删除 wrangler.toml 中免费版不支持的 cpu_ms 和 limits 配置
      - name: Fix wrangler.toml for Cloudflare Free Plan
        run: |
          sed -i '/cpu_ms/d' wrangler.toml
          sed -i '/\[limits\]/d' wrangler.toml

      # 4. 安装依赖并尝试构建
      - name: Install and Build
        run: |
          if [ -f "package.json" ]; then
            npm install
            npm run build --if-present
          fi

      # 5. 执行 Cloudflare 部署
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
