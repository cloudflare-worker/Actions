name: Deploy External Worker to Cloudflare

on:
  push:
    branches:
      - main
  # 允许你在 GitHub 页面上随时点击按钮手动触发部署
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 直接拉取源项目的代码到当前运行环境
      - name: Checkout Source Repository
        uses: actions/checkout@v4
        with:
          repository: '1345695/edcloudwasm'
          ref: 'main' # 如果源项目的默认分支是 master，请改成 master

      # 2. 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. 安装源项目的依赖
      - name: Install Dependencies
        run: npm ci || npm install

      # 4. 构建项目（如果源项目有 build 步骤）
      - name: Build Project
        run: npm run build
        continue-on-error: true

      # 5. 使用你存储在 Actions 里的 Secrets 部署到你的 Cloudflare
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
